                    "meuScanner.input();"
                ],
                ans: 0 // A
            },
            {
                q: "Qual a opção correta para devolver o primeiro elemento no ArrayList nums?",
                opts: ["nums.get(0)", "nums[0]", "nums(0)", "nums[1]"],
                ans: 0 // A
            },
            {
                q: "É muito importante nos ambientarmos com as nomenclaturas. Baseado neste contexto podemos afirmar que o JDK é:",
                opts: [
                    "uma biblioteca responsável pela execução das aplicações na JVM.",
                    "é responsável por executar instruções compiladas em Java.",
                    "é um kit de ferramentas web",
                    "é o Kit de Desenvolvimento (Java Development Kit)."
                ],
                ans: 3 // D
            },
            {
                q: "O que é uma classe?",
                opts: [
                    "Modelo de um método.",
                    "Modelo abstrato do domínio do problema (molde/plantar).",
                    "Forma abstrata do objeto do nosso problema.",
                    "Entidade abstrata com responsabilidades."
                ],
                ans: 1 // B
            },
            {
                q: "Quando dizemos que uma classe (subclasse) herda de outra classe (superclasse). Estamos dizendo que esta classe herda quais elementos?",
                opts: [
                    "Valores (String e int);",
                    "Herança e encapsulamento;",
                    "Métodos (atributos e classes);",
                    "Características (atributos e métodos);"
                ],
                ans: 3 // D
            }
        ];

        let currentQuestionIndex = 0;
        let scoreBlue = 0;
        let scoreYellow = 0;
        let isRevealed = false;
        let selectedOptionIndex = null;

        const alphabet = ['A', 'B', 'C', 'D', 'E'];

        function initApp() {
            renderQuestion();
            updateScoreDisplay();
            setGameStatus('Normal');
        }

        function renderQuestion() {
            isRevealed = false;
            selectedOptionIndex = null;
            document.getElementById('btn-reveal').disabled = false;
            document.getElementById('btn-reveal').classList.remove('opacity-50', 'cursor-not-allowed');

            const q = questions[currentQuestionIndex];
            
            // Atualizar contadores
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('question-id-display').innerText = `#Q${currentQuestionIndex + 1}`;
            
            // Processar texto da questão para blocos de código
            const questionContainer = document.getElementById('question-text');
            // Se contiver public class ou system.out, vamos estilizar como codigo
            let formattedText = q.q.replace(/\n/g, '<br/>');
            
            if (q.q.includes('public class') || q.q.includes('int[]') || q.q.includes('double x=')) {
                // Separa partes que parecem código
                const parts = q.q.split(/(public class|public static|int \[\]|double x=)/);
                if(parts.length > 1) {
                    const idx = q.q.indexOf(parts[1]);
                    const normalText = q.q.substring(0, idx);
                    const codeText = q.q.substring(idx);
                    formattedText = `${normalText.replace(/\n/g, '<br/>')} <div class="code-block animate-slide-in">${codeText}</div>`;
                }
            }
            
            questionContainer.innerHTML = formattedText;
            
            // Animação de reset
            questionContainer.classList.remove('animate-slide-in');
            void questionContainer.offsetWidth; // trigger reflow
            questionContainer.classList.add('animate-slide-in');

            // Renderizar opções
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            q.opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-300 flex items-center gap-4 group`;
                btn.onclick = () => selectOption(index);
                
                const letterBadge = document.createElement('span');
                letterBadge.className = `flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-full bg-slate-800 text-slate-300 font-bold border border-slate-600 group-hover:bg-blue-600 group-hover:text-white transition-colors`;
                letterBadge.innerText = alphabet[index];
                
                const optText = document.createElement('span');
                optText.className = "text-base md:text-lg font-medium text-slate-200 break-words w-full";
                optText.innerHTML = opt.replace(/\n/g, '<br/>');

                btn.appendChild(letterBadge);
                btn.appendChild(optText);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(index) {
            if (isRevealed) return; // Nao deixa trocar se já revelou
            
            selectedOptionIndex = index;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('selected');
                    btn.querySelector('span:first-child').classList.add('bg-blue-600', 'text-white', 'border-blue-500');
                    btn.querySelector('span:first-child').classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-600');
                } else {
                    btn.classList.remove('selected');
                    btn.querySelector('span:first-child').classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                    btn.querySelector('span:first-child').classList.add('bg-slate-800', 'text-slate-300', 'border-slate-600');
                }
            });
        }

        function revealAnswer() {
            if (isRevealed) return;
            isRevealed = true;
            
            const q = questions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            document.getElementById('btn-reveal').disabled = true;
            document.getElementById('btn-reveal').classList.add('opacity-50', 'cursor-not-allowed');

            buttons.forEach((btn, i) => {
                // Remover classes de seleção visual
                btn.classList.remove('selected');
                
                if (i === q.ans) {
                    btn.classList.add('correct', 'animate-bounce-slight');
                    btn.querySelector('span:first-child').classList.add('bg-white', 'text-green-600', 'border-white');
                } else {
                    if (i === selectedOptionIndex) {
                        btn.classList.add('wrong');
                        btn.querySelector('span:first-child').classList.add('bg-white', 'text-red-600', 'border-white');
                    } else {
                        btn.classList.add('faded');
                    }
                }
            });
        }

        function updateScore(team, amount) {
            if (team === 'blue') {
                scoreBlue += amount;
                if (scoreBlue < 0) scoreBlue = 0;
            } else {
                scoreYellow += amount;
                if (scoreYellow < 0) scoreYellow = 0;
            }
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            document.getElementById('score-blue').innerText = scoreBlue;
            document.getElementById('score-yellow').innerText = scoreYellow;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                setGameStatus('Normal');
                renderQuestion();
            } else {
                // Fim das questões
                const qText = document.getElementById('question-text');
                qText.innerHTML = `<div class="text-center py-10"><span class="text-5xl mb-4 block">🏆</span><br>Fim do Jogo! <br> <span class="text-xl text-blue-400 mt-4 block">Azul: ${scoreBlue} pts | Amarela: ${scoreYellow} pts</span></div>`;
                document.getElementById('options-grid').innerHTML = '';
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                setGameStatus('Normal');
                renderQuestion();
            }
        }

        function setGameStatus(status) {
            const badges = document.querySelectorAll('.badge-btn');
            badges.forEach(btn => {
                if (btn.innerText === status || (status === 'Normal' && btn.innerText === 'Valendo')) {
                    btn.classList.remove('opacity-50');
                    btn.classList.add('shadow-[0_0_15px_rgba(255,255,255,0.4)]', 'scale-110', 'bg-white/30');
                } else {
                    btn.classList.add('opacity-50');
                    btn.classList.remove('shadow-[0_0_15px_rgba(255,255,255,0.4)]', 'scale-110', 'bg-white/30');
                }
            });
        }

        // Inicia a aplicação ao carregar a página
        window.onload = initApp;

    </script>
</body>
</html>
